# O xdg-user-dirs-update roda a cada login e, por padrão, recria as pastas
# do home traduzidas para o locale da sessão -- em pt_BR, por exemplo, ele
# renomearia "Desktop" para "Área de trabalho", quebrando o XDG_DESKTOP_DIR
# que definimos em user-dirs.dirs e todo caminho que aponte para ~/Desktop.
#
# Este projeto define essas pastas explicitamente (user-dirs.dirs) e cria
# ~/Desktop já no build, então o updater só teria como efeito desfazer isso.
# Desligado para o resultado ser idêntico em qualquer idioma de ISO.
enabled=False
